# Build images from a branch of this fork (for example oan-sms: COSS develop plus the OAN Messaging
# OTP delivery) for a test install. Manual only. Tags: :<branch> and :<branch>-<12-char sha>;
# never :latest or :develop, which belong to the mirror workflow (oan-images.yml).
name: Build branch images

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch of this fork to build
        required: true
        default: oan-sms

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { role: consent-manager-api, dockerfile: docker/consent-manager-api/Dockerfile, context: . }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}
      - id: meta
        shell: bash
        run: |
          owner=$(tr '[:upper:]' '[:lower:]' <<<"${{ github.repository_owner }}")
          branch=$(tr '/' '-' <<<"${{ inputs.branch }}")
          echo "image=ghcr.io/$owner/commons/${{ matrix.role }}" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "sha12=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.branch }}
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.branch }}-${{ steps.meta.outputs.sha12 }}
